[project]
name = "pdf-cuter"
version = "0.1.0"
description = "Aplicação leve para separar páginas de arquivos PDF"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=5.2.2",
    "pypdf>=5.0.0",
    "tkinterdnd2>=0.4.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
